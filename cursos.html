<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - Emissor de Certificados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2>Gerenciar Cursos</h2>

        <form id="cursoForm" class="row g-3 mb-4">
            <input type="hidden" id="cursoId">
            <div class="col-md-4">
                <input type="text" id="nomeCurso" class="form-control" placeholder="Nome do Curso" required>
            </div>
            <div class="col-md-5">
                <input type="text" id="descricaoCurso" class="form-control" placeholder="Descrição" required>
            </div>
            <div class="col-md-2">
                <input type="number" id="cargaHoraria" class="form-control" placeholder="Horas" required>
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>
        </form>

        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Carga Horária</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="cursosTableBody"></tbody>
        </table>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/cursos.js"></script>
</body>

</html>
