<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Certificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container mt-4">
        <h2>Validação Pública de Certificado</h2>

        <form id="validacaoForm" class="row g-3 mb-4">
            <div class="col-md-10">
                <input type="text" id="codigoValidacao" class="form-control" placeholder="Código de Autenticação"
                    required>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">Validar</button>
            </div>
        </form>

        <div id="resultadoValidacao" class="certificado d-none"></div>
        <div id="acoesCertificado" class="mt-3 text-center d-none">
            <button class="btn btn-outline-primary me-2" onclick="window.print()">Imprimir</button>
            <button class="btn btn-outline-success me-2" onclick="downloadAsImage('resultadoValidacao')">Salvar como
                JPEG</button>
            <button class="btn btn-outline-danger" onclick="downloadAsPDF('resultadoValidacao')">Salvar como PDF</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/validacao.js"></script>
    <script src="assets/js/utils.js"></script>
</body>

</html>
