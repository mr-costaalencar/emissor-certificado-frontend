<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Certificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2>Validação Pública de Certificado</h2>

        <form id="validacaoForm" class="row g-3 mb-4">
            <div class="col-md-10">
                <input type="text" id="codigoValidacao" class="form-control" placeholder="Código de Autenticação"
                    required>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">Validar</button>
            </div>
        </form>
        <div id="resultadoValidacao" class="alert alert-info d-none"></div>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/validacao.js"></script>
</body>

</html>
