<!-- certificados.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emitir Certificados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2>Emitir Certificado</h2>

        <form id="certificadoForm" class="row g-3 mb-4">
            <div class="col-md-5">
                <select id="alunoSelect" class="form-select" required>
                    <option value="">Selecione o aluno</option>
                </select>
            </div>
            <div class="col-md-5">
                <select id="cursoSelect" class="form-select" required>
                    <option value="">Selecione o curso</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-success">Emitir</button>
            </div>
        </form>
        <div id="certificadoInfo" class="alert alert-info d-none"></div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/certificados.js"></script>
</body>

</html>
