<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Emissor de Certificados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2>Gerenciar Usuários</h2>

        <form id="usuarioForm" class="row g-3 mb-4">
            <input type="hidden" id="usuarioId">
            <div class="col-md-5">
                <input type="email" id="emailUsuario" class="form-control" placeholder="Email" required>
            </div>
            <div class="col-md-5">
                <input type="password" id="senhaUsuario" class="form-control" placeholder="Senha" required>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>
        </form>

        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="usuariosTableBody"></tbody>
        </table>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/usuarios.js"></script>
</body>

</html>
