<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos - Emissor de Certificados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2>Gerenciar Alunos</h2>

        <form id="alunoForm" class="row g-3 mb-4">
            <input type="hidden" id="alunoId">
            <div class="col-md-4">
                <input type="text" id="nome" class="form-control" placeholder="Nome" required>
            </div>
            <div class="col-md-3">
                <input type="text" id="cpf" class="form-control" placeholder="CPF" required>
            </div>
            <div class="col-md-4">
                <input type="email" id="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-success">Salvar</button>
            </div>
        </form>

        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="alunosTableBody"></tbody>
        </table>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/alunos.js"></script>
</body>

</html>
